[project]
name = "openbox-agentmail-sdk-python"
version = "0.1.0"
description = "OpenBox governance for AgentMail agents: every send, reply, forward, draft, read and inbound email is evaluated by OpenBox policy before it reaches the agent or AgentMail."
authors = [{ name = "OpenBox Team" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["openbox", "agentmail", "email", "agent", "governance", "hitl", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "openbox-sdk-python[http]>=1.3.1,<2",
    "agentmail>=2.0,<3",
]

[project.urls]
# TODO: confirm the public repo URL before publishing - a broken PyPI link is
# worse than none. Delete this table if the repo is not public yet.
Homepage = "https://github.com/OpenBox-AI/openbox-agentmail-sdk-python"
Repository = "https://github.com/OpenBox-AI/openbox-agentmail-sdk-python"
Documentation = "https://docs.openbox.ai"

[project.optional-dependencies]
mcp = ["httpx>=0.28", "uvicorn>=0.30"]
toolkit = ["agentmail-toolkit>=0.3"]
all = ["openbox-agentmail-sdk-python[mcp,toolkit]"]

[project.scripts]
openbox-agentmail-mcp = "openbox_agentmail.mcp_proxy.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.26.0,<0.27",
    "ruff>=0.8.0",
    "starlette>=0.40",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbox_agentmail"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
